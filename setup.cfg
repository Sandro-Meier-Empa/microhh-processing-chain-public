[metadata]
name = processing_chain
author = Sandro Meier
version = 0.1.0
author_email = sandro.meier@empa.ch
description = Processing chain for MicroHH simulations
long_description = file: README.md
long_description_content_type = text/markdown
url = https://gitlab.empa.ch/abt503/atmospheric-modelling/microhh-processing-chain
project_urls =
    Bug Tracker = https://gitlab.empa.ch/abt503/atmospheric-modelling/microhh-processing-chain/-/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent


[options]
package_dir =
    = src
packages = find:
include_package_data = True
python_requires = >=3.9
install_requires =
    ipywidgets
    lxml
    pyproj
    spectral
    astropy
    pandas
    numpy
    xarray
    matplotlib
    cartopy
    seaborn
    tqdm
    timezonefinder
    scipy
    astropy
    cdsapi
    dill
    dask
    ipympl
    netcdf4
    scikit-learn
    ipykernel
    cmcrameri

[options.packages.find]
where = src



