[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microhh_processing"
version = "0.1.0"
description = "Processing chain for MicroHH simulations"
readme = "README.md"
authors = [
    { name = "Sandro Meier", email = "sandro.meier@empa.ch" }
]
requires-python = ">=3.9"
license = { text = "MIT" }

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

dependencies = [
    "ipywidgets",
    "lxml",
    "pyproj",
    "spectral",
    "astropy",
    "pandas",
    "numpy",
    "xarray",
    "matplotlib",
    "cartopy",
    "seaborn",
    "tqdm",
    "timezonefinder",
    "scipy",
    "cdsapi",
    "dill",
    "dask",
    "ipympl",
    "netcdf4",
    "scikit-learn",
    "ipykernel",
    "cmcrameri",
    "seaborn",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

