[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microhh-processing-chain"
dynamic = ["version"]
description = "Processing chain for MicroHH simulations"
readme = "README.md"
authors = [
    { name = "Sandro Meier", email = "sandro.meier@empa.ch" }
]
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["microhh", "large-eddy simulation", "atmospheric modelling", "post-processing"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "scipy",
    "dask[distributed]",
    "dask-jobqueue",
    "bokeh",
    "pyproj",
    "netCDF4",
    "matplotlib",
    "cartopy",
    "cscs @ git+https://gitlab.empa.ch/abt503/users/mesa/cscs.git",
    "ipympl",
    "ipykernel",
    "ipywidgets",
    "IPython",
    "seaborn",
    "tqdm",
    "ls2d",
]

[project.optional-dependencies]
dev = [
  "bump-my-version>=1,<2",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "mypy",
]

[project.urls]
Homepage = "https://gitlab.empa.ch/abt503/atmospheric-modelling/microhh-processing-chain"
Repository = "https://gitlab.empa.ch/abt503/atmospheric-modelling/microhh-processing-chain.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.bumpversion]
allow_dirty = false
commit = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Release {new_version}"
setup_hooks = [
  "pre-commit run --all-files",
#  "python -m pytest",
]

[tool.ruff]
target-version = "py39" # to prevent warnings of not using | for union types
line-length = 88
exclude = ["**/archive"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins — shadows of Python builtins
    "ANN",  # flake8-annotations — missing type annotations
    "B",    # flake8-bugbear — likely bugs and design problems
    "C4",   # flake8-comprehensions — suboptimal comprehensions
    "D",    # pydocstyle — docstring conventions
    "E",    # pycodestyle errors — PEP 8 style errors
    "F",    # pyflakes — undefined names, unused imports
    "G",    # flake8-logging-format — logging anti-patterns
    "I",    # isort — import ordering
    "N",    # pep8-naming — naming convention violations
    "PTH",  # flake8-use-pathlib — prefer pathlib over os.path
    "RUF",  # Ruff-native rules — high quality, low noise
    "SIM",  # flake8-simplify — simplifiable code patterns
    "T10",  # flake8-debugger — leftover debugger statements
    "TRY",  # tryceratops — exception handling anti-patterns
    "UP",   # pyupgrade — outdated syntax modernisation
    "W",    # pycodestyle warnings — PEP 8 style warnings
]
ignore = [
    "D100",    # missing docstring in public module
    "D103",    # missing docstring in public function
    "D104",    # missing docstring in public package
    "D107",    # missing docstring in __init__ — args go in class docstring (Google style)
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "TRY003",  # long exception messages — too pedantic for simple raises
]

[tool.ruff.lint.pydocstyle]
convention = "google"
