[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microhh_processing"
version = "1.0.0"
description = "Processing chain for MicroHH simulations"
readme = "README.md"
authors = [
    { name = "Sandro Meier", email = "sandro.meier@empa.ch" }
]
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["microhh", "large-eddy simulation", "atmospheric modelling", "post-processing"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "scipy",
    "dask",
    "pyproj",
    "netCDF4",
    "matplotlib",
    "cartopy",
    "ipympl",
    "ipykernel",
    "ipywidgets",
    "IPython",
    "seaborn",
    "tqdm",
]

[project.optional-dependencies]
dev = [
  "pre-commit",
  "pytest",
  "pytest-cov",
  "mypy",
]

[project.urls]
Homepage = "https://gitlab.empa.ch/abt503/atmospheric-modelling/microhh-processing-chain"
Repository = "https://gitlab.empa.ch/abt503/atmospheric-modelling/microhh-processing-chain.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
